<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Radián Iluminación</title>
<link rel="icon" type="image/svg+xml" href="radian-mark.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + category rail; catalog = filter sidebar + product grid; product = gallery | info; admin = list | edit form */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#131A23; --muted:#5A6676; --line:#DCE2E9;
  --accent:#B85F0E; --accent-soft:#FBEBD8; --accent-ink:#FFFFFF;
  --warm:#FFBE5C; --neutral:#FFE7B8; --cool:#BFDDFF; --ok:#23784A; --danger:#B3261E;
  --player:#10151C; --player-ink:#E9EEF4;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#151C25; --surface-2:#1C2531; --ink:#E7ECF2; --muted:#94A1B2; --line:#283341;
  --accent:#F2A24E; --accent-soft:#3A2814; --accent-ink:#1B1104;
  --warm:#FFB547; --neutral:#FFE1A6; --cool:#9CC8F7; --ok:#5CC48A; --danger:#F08A80;
  --player:#070A0E; --player-ink:#E9EEF4; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151C25; --surface-2:#1C2531; --ink:#E7ECF2; --muted:#94A1B2; --line:#283341;
  --accent:#F2A24E; --accent-soft:#3A2814; --accent-ink:#1B1104;
  --warm:#FFB547; --neutral:#FFE1A6; --cool:#9CC8F7; --ok:#5CC48A; --danger:#F08A80;
  --player:#070A0E; --player-ink:#E9EEF4; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
.wrap{max-width:1180px; margin:0 auto; padding-left:var(--gut-l); padding-right:var(--gut-r)}
.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* demo bar */
.demo{background:var(--ink); color:var(--bg); font-size:13px}
.demo .wrap{display:flex; gap:12px; align-items:center; justify-content:space-between; padding-block:7px; flex-wrap:wrap}
.seg{display:flex; background:color-mix(in srgb, var(--bg) 14%, transparent); border-radius:999px; padding:3px}
.seg a{text-decoration:none; padding:4px 12px; border-radius:999px; font-weight:600}
.seg a[aria-current="true"]{background:var(--bg); color:var(--ink)}

/* header */
header.site{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.hrow{display:flex; align-items:center; gap:20px; padding-block:14px}
.logo{display:flex; align-items:center; gap:9px; text-decoration:none; flex:none}
.logo .wm{display:block; color:var(--ink); width:auto}
.logo svg{flex:none}
.logo small{display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.search{position:relative; flex:1; min-width:0}
.search input{width:100%; height:44px; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:0 18px 0 42px}
.search input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute; left:15px; top:13px; color:var(--muted)}
.sugg{position:absolute; left:0; right:0; top:50px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 14px 40px rgb(0 0 0 / .14); overflow:hidden}
.sugg a{display:flex; gap:12px; align-items:center; padding:8px 12px; text-decoration:none}
.sugg a:hover,.sugg a.on{background:var(--surface-2)}
.sugg .t{width:42px; height:42px; border-radius:6px; overflow:hidden; flex:none; background:var(--surface-2)}
.sugg .n{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sugg .p{font-weight:700}
.sugg .all{justify-content:center; color:var(--accent); font-weight:600; border-top:1px solid var(--line)}
.sugg .empty{padding:14px; color:var(--muted)}
.hlink{flex:none; font-weight:600; text-decoration:none; font-size:14px; display:flex; gap:6px; align-items:center}
.rail{border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .wrap{display:flex; gap:4px; padding-block:6px; width:max-content; min-width:100%}
.rail a{white-space:nowrap; text-decoration:none; padding:7px 12px; border-radius:6px; font-size:14px; font-weight:500; color:var(--muted)}
.rail a:hover{color:var(--ink); background:var(--surface-2)}
.rail a.on{color:var(--ink); background:var(--accent-soft)}

main{padding-block:28px 64px; min-height:60vh}

/* hero */
.hero{display:grid; grid-template-columns:1.15fr .85fr; gap:28px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:36px; overflow:hidden; position:relative}
.hero h1{font-size:clamp(30px,4.6vw,52px); line-height:1.02; font-weight:800}
.hero p{color:var(--muted); max-width:46ch; margin:14px 0 22px; font-size:16px}
.btn{display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 20px; border-radius:999px; border:1px solid transparent; font-weight:600; text-decoration:none; cursor:pointer; background:var(--accent); color:var(--accent-ink)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:36px; padding:0 14px; font-size:14px}
.btn.danger{background:transparent; border-color:var(--line); color:var(--danger)}
.kelvin{margin-top:26px}
.kbar{height:10px; border-radius:999px; background:linear-gradient(90deg,#FF9F3A,#FFC86E 22%,#FFE9C2 45%,#F4F6FF 70%,#BCD9FF)}
.kticks{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:11px; color:var(--muted); margin-top:6px}
.kticks span{display:flex; flex-direction:column}
.kticks i{font-style:normal; font-family:var(--f-body); font-size:11px}
.hero-art{aspect-ratio:1; max-width:100%; justify-self:center; width:min(100%,380px)}
.hero-art img{display:block; width:100%; height:auto; filter:drop-shadow(0 18px 30px rgb(0 0 0 / .28))}

/* sections */
.sec{margin-top:44px}
.sec-h{display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:16px}
.sec-h h2{font-size:26px; font-weight:700}
.sec-h a{font-weight:600; color:var(--accent); text-decoration:none; font-size:14px}
.cats{display:grid; grid-template-columns:repeat(6,1fr); gap:12px}
.cat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px; text-decoration:none; display:flex; flex-direction:column; gap:10px; transition:border-color .15s, transform .15s}
.cat:hover{border-color:var(--accent); transform:translateY(-2px)}
.cat .im{aspect-ratio:4/3; border-radius:7px; overflow:hidden}
.cat b{font-weight:600; font-size:14px; line-height:1.25}
.cat small{color:var(--muted); font-size:12px}

/* product grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; text-decoration:none; transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line)); box-shadow:0 10px 28px rgb(0 0 0 / .08)}
.card .im{aspect-ratio:1; position:relative; overflow:hidden; background:var(--surface-2)}
.card .im img{width:100%; height:100%; object-fit:cover; display:block}
.badge{position:absolute; top:10px; left:10px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 8px; border-radius:5px; background:var(--surface); color:var(--ink)}
.badge.off{background:var(--accent); color:var(--accent-ink)}
.badge.vid{left:auto; right:10px; display:flex; gap:4px; align-items:center}
.card .bd{padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1}
.card .nm{font-weight:600; line-height:1.3; font-size:14.5px}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; font-family:var(--f-mono); font-size:11.5px; color:var(--muted)}
.kdot{display:inline-flex; align-items:center; gap:5px}
.kdot::before{content:""; width:9px; height:9px; border-radius:50%; background:var(--kc,var(--warm)); box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.price{margin-top:auto; padding-top:6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.price b{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
.price s{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.nostock{font-size:12px; color:var(--danger); font-weight:600}

/* catalog */
.cat-layout{display:grid; grid-template-columns:230px 1fr; gap:28px; align-items:start}
.side{position:sticky; top:150px; display:flex; flex-direction:column; gap:22px}
.fgroup h3{font-family:var(--f-body); font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-bottom:8px}
.flist{display:flex; flex-direction:column; gap:2px}
.flist button{all:unset; cursor:pointer; display:flex; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:6px; font-size:14px}
.flist button:hover{background:var(--surface-2)}
.flist button.on{background:var(--accent-soft); font-weight:600}
.flist button:focus-visible{outline:2px solid var(--accent)}
.flist small{color:var(--muted); font-variant-numeric:tabular-nums}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.chip.on{border-color:var(--accent); background:var(--accent-soft); font-weight:600}
.toolbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px}
.toolbar h1{font-size:28px; font-weight:700}
.toolbar .count{color:var(--muted); font-size:14px}
select{height:38px; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:0 10px}
.active{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.empty-state{background:var(--surface); border:1px dashed var(--line); border-radius:var(--r); padding:40px 20px; text-align:center; color:var(--muted)}
.empty-state b{display:block; color:var(--ink); font-size:17px; margin-bottom:6px}
.fbtn{display:none}

/* product */
.crumbs{font-size:13px; color:var(--muted); margin-bottom:18px; display:flex; gap:6px; flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.pd{display:grid; grid-template-columns:1.05fr .95fr; gap:36px; align-items:start}
.gal-main{aspect-ratio:1; border-radius:14px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line)}
.gal-main img{width:100%; height:100%; object-fit:cover; display:block}
.thumbs{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap}
.thumbs button{all:unset; cursor:pointer; width:72px; height:72px; border-radius:8px; overflow:hidden; border:2px solid transparent; background:var(--surface-2)}
.thumbs button.on{border-color:var(--accent)}
.thumbs button img{width:100%; height:100%; object-fit:cover; display:block}
.thumbs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.pinfo h1{font-size:clamp(26px,3.2vw,36px); line-height:1.08; font-weight:700; margin:6px 0 10px}
.pprice{display:flex; gap:12px; align-items:baseline; margin:18px 0 4px; flex-wrap:wrap}
.pprice b{font-size:34px; font-family:var(--f-display); font-weight:700; font-variant-numeric:tabular-nums}
.pprice s{color:var(--muted)}
.pnote{font-size:13px; color:var(--muted)}
.specs{margin:22px 0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.specs div{display:grid; grid-template-columns:140px 1fr; gap:12px; padding:9px 14px; border-top:1px solid var(--line); font-size:14px}
.specs div:first-child{border-top:0}
.specs dt{color:var(--muted)}
.specs dd{margin:0; font-family:var(--f-mono); font-size:13px}
.cta{display:flex; gap:10px; flex-wrap:wrap}
.wa{background:#1F8F55; color:#fff}
.desc{margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:36px}
.desc p{max-width:62ch; color:var(--ink); margin:10px 0 0}
.desc h2{font-size:22px}
.player{aspect-ratio:16/9; max-width:100%; background:var(--player); color:var(--player-ink); border-radius:12px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; margin-top:12px}
.player .glow{position:absolute; inset:0; background:radial-gradient(60% 70% at 50% 40%, color-mix(in srgb,var(--warm) 35%,transparent), transparent 70%)}
.player .play{position:relative; width:68px; height:48px; border-radius:12px; background:#E3342F; display:grid; place-items:center}
.player .cap{position:absolute; left:14px; right:14px; bottom:12px; font-size:13px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.player a{color:var(--player-ink); font-weight:600}
.vnote{font-size:13px; color:var(--muted); margin-top:8px}

/* admin */
.cms-intro{background:var(--accent-soft); border-radius:var(--r); padding:14px 18px; margin-bottom:22px; font-size:14px; display:flex; gap:14px; align-items:flex-start}
.cms-intro p{margin:0; max-width:90ch}
.cms{display:grid; grid-template-columns:1fr 430px; gap:24px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.panel-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.panel-h h2{font-size:18px; font-weight:700}
.panel-h input{height:36px; border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:0 12px; min-width:0; flex:1; max-width:240px}
.tbl{overflow-x:auto; max-height:640px; overflow-y:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 12px; font-weight:600}
td{padding:8px 12px; border-top:1px solid var(--line); vertical-align:middle}
tr.sel td{background:var(--accent-soft)}
td .t{width:40px; height:40px; border-radius:6px; overflow:hidden; background:var(--surface-2)}
td .t img{width:100%; height:100%; object-fit:cover}
.rowbtn{all:unset; cursor:pointer; color:var(--accent); font-weight:600; font-size:13px}
form.edit{padding:16px; display:flex; flex-direction:column; gap:14px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:13px; font-weight:600}
.field .hint{font-size:12px; color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:9px 11px; width:100%}
.field textarea{min-height:90px; resize:vertical}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.drop{border:1.5px dashed var(--line); border-radius:10px; padding:14px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--accent); color:var(--ink)}
.drop input{display:none}
.imgs{display:flex; gap:8px; flex-wrap:wrap}
.imgs div{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
.imgs img{width:100%; height:100%; object-fit:cover}
.imgs button{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:0; background:rgb(0 0 0 / .65); color:#fff; font-size:12px; line-height:20px; cursor:pointer; padding:0}
.check{display:flex; gap:8px; align-items:center; font-size:14px}
.form-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between; padding-top:4px}
.yt-ok{color:var(--ok); font-size:12px; font-weight:600}
.yt-bad{color:var(--danger); font-size:12px; font-weight:600}

footer{border-top:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--muted)}
footer .wrap{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:22px}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:10px; font-size:14px; z-index:50; max-width:calc(100% - 32px); box-shadow:0 10px 30px rgb(0 0 0 / .25)}

@media (max-width:980px){
  .cats{grid-template-columns:repeat(3,1fr)}
  .cms{grid-template-columns:1fr}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr; padding:24px}
  .hero-art{max-width:260px}
  .cat-layout{grid-template-columns:1fr}
  .side{position:static; display:none}
  .side.open{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px}
  .fbtn{display:inline-flex}
  .pd,.desc{grid-template-columns:1fr; gap:24px}
  .hlink span{display:none}
}
@media (max-width:560px){
  .hrow{flex-wrap:wrap; gap:12px}
  .search{order:3; flex-basis:100%}
  .logo{margin-right:auto}
  .cats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  .card .bd{padding:10px}
  .price b{font-size:16px}
  .specs div{grid-template-columns:110px 1fr}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="demo">
  <div class="wrap">
    <span>Prototipo de tu tienda · productos de ejemplo</span>
    <nav class="seg" aria-label="Vista">
      <a href="#inicio" id="segShop" aria-current="true">Tu tienda</a>
      <a href="#admin" id="segAdmin">Tu panel</a>
    </nav>
  </div>
</div>

<header class="site">
  <div class="wrap hrow">
    <a class="logo" href="#inicio" aria-label="Radián, inicio">
      <svg viewBox="0 0 600 600" width="38" height="38" aria-hidden="true">
<defs>
<linearGradient id="rmMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".32" stop-color="#DCDDE0"/><stop offset=".56" stop-color="#868990"/><stop offset=".78" stop-color="#ECEDEF"/><stop offset="1" stop-color="#A3A6AB"/></linearGradient>
<linearGradient id="rmRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F5F6"/><stop offset=".5" stop-color="#7E8187"/><stop offset="1" stop-color="#E6E7E9"/></linearGradient>
<radialGradient id="rmBg" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#2C2D30"/><stop offset=".55" stop-color="#111214"/><stop offset="1" stop-color="#050506"/></radialGradient>
</defs>
<circle cx="300" cy="300" r="286" fill="url(#rmBg)"/>
<circle cx="300" cy="300" r="282" fill="none" stroke="url(#rmRing)" stroke-width="7"/>
<g transform="translate(300 268) skewX(-14) translate(-300 -268)" fill="url(#rmMetal)">
  <path d="M172 152 H338 A66 66 0 0 1 338 284 H300 L392 384 H334 L246 284 V384 H196 V246 H338 A28 28 0 0 0 338 190 H210 Z"/>

/* ---------- product art (inline SVG, theme-aware) ---------- */
function glowOf(t){ return t==='RGB'?'url(#rgb)':(t==='6500K'?'var(--cool)':t==='4000K'?'var(--neutral)':'var(--warm)'); }
function art(p,variant=0){
  const type=(CATS.find(c=>c.id===p.cat)||{}).type||'bulb';
  const g=glowOf(p.temp), uid='g'+p.id+'_'+variant+'_'+Math.random().toString(36).slice(2,6);
  const bgs=['var(--surface-2)','color-mix(in srgb, var(--surface-2) 70%, var(--accent-soft))','color-mix(in srgb, var(--surface-2) 60%, var(--player))'];
  const bg=bgs[variant%3], ink='var(--ink)';
  let s='';
  const halo=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${uid})"/>`;
  if(type==='bulb'){
    s=halo(100,86,78)+`<path d="M100 36c-26 0-44 19-44 43 0 16 9 27 17 36 5 6 7 11 7 17h40c0-6 2-11 7-17 8-9 17-20 17-36 0-24-18-43-44-43z" fill="${g}" opacity=".95"/>
    <path d="M86 98c5 8 9 12 14 12s9-4 14-12" fill="none" stroke="${ink}" stroke-width="2.5" opacity=".35"/>
    <rect x="80" y="134" width="40" height="8" rx="2" fill="${ink}" opacity=".8"/><rect x="82" y="144" width="36" height="7" rx="2" fill="${ink}" opacity=".7"/><rect x="85" y="153" width="30" height="7" rx="2" fill="${ink}" opacity=".6"/><path d="M92 162h16l-4 8h-8z" fill="${ink}" opacity=".85"/>`;
  } else if(type==='panel'){
    s=halo(100,100,90)+`<rect x="42" y="42" width="116" height="116" rx="10" fill="${ink}" opacity=".85"/><rect x="50" y="50" width="100" height="100" rx="6" fill="${g}"/><rect x="50" y="50" width="100" height="100" rx="6" fill="#fff" opacity=".25"/>`;
  } else if(type==='strip'){
    let dots=''; for(let i=0;i<9;i++){ const x=28+i*18, y=100+Math.sin(i*.8)*26; dots+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="2" fill="${g}"/>`; }
    s=halo(100,100,86)+`<path d="M20 100 C 50 60, 70 140, 100 100 S 150 60, 180 100" fill="none" stroke="${ink}" stroke-width="16" stroke-linecap="round" opacity=".8"/>`+
      `<path d="M20 100 C 50 60, 70 140, 100 100 S 150 60, 180 100" fill="none" stroke="${g}" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 11"/>`;
  } else if(type==='flood'){
    s=`<path d="M70 104 L10 196 H190 L130 104z" fill="${g}" opacity=".35"/>`+halo(100,92,70)+`<rect x="52" y="54" width="96" height="74" rx="8" fill="${ink}" opacity=".88"/><rect x="62" y="64" width="76" height="54" rx="4" fill="${g}"/>
    <path d="M60 54v-8M74 54v-8M88 54v-8M102 54v-8M116 54v-8M130 54v-8M142 54v-8" stroke="${ink}" stroke-width="4" opacity=".7"/><path d="M84 128l-6 22h44l-6-22" fill="none" stroke="${ink}" stroke-width="5" opacity=".7"/>`;
  } else if(type==='pendant'){
    s=`<path d="M60 112 L22 196 H178 L140 112z" fill="${g}" opacity=".3"/>`+halo(100,118,60)+`<line x1="100" y1="0" x2="100" y2="58" stroke="${ink}" stroke-width="3"/><rect x="92" y="56" width="16" height="12" rx="2" fill="${ink}"/>
    <path d="M100 66c-30 0-46 22-50 50h100c-4-28-20-50-50-50z" fill="${ink}" opacity=".88"/><ellipse cx="100" cy="116" rx="50" ry="7" fill="${g}"/><circle cx="100" cy="120" r="10" fill="${g}"/>`;
  } else {
    s=`<rect x="44" y="70" width="112" height="62" rx="8" fill="${ink}" opacity=".85"/>
    <path d="M58 86h40M58 98h28" stroke="var(--surface)" stroke-width="5" stroke-linecap="round" opacity=".5"/><circle cx="134" cy="101" r="9" fill="var(--warm)"/>
    <path d="M44 100H20M156 92h24M156 110h24" stroke="${ink}" stroke-width="5" stroke-linecap="round" opacity=".7"/>`;
  }
  return `<svg viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(p.name)}">
  <defs><radialGradient id="${uid}"><stop offset="0" stop-color="${p.temp==='RGB'?'#C9A2FF':(g)}" stop-opacity=".75"/><stop offset="1" stop-color="${p.temp==='RGB'?'#C9A2FF':(g)}" stop-opacity="0"/></radialGradient>
  <linearGradient id="rgb" x1="0" x2="1"><stop offset="0" stop-color="#FF5E7E"/><stop offset=".5" stop-color="#7C6CFF"/><stop offset="1" stop-color="#3DD6B0"/></linearGradient></defs>
  <rect width="200" height="200" fill="${bg}"/>${s}</svg>`;
}
function thumb(p,i=0){ return p.images[i]?`<img src="${p.images[i]}" alt="${esc(p.name)}">`:art(p,i); }

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const catName=id=>(CATS.find(c=>c.id===id)||{}).name||id;
const kc=t=>t==='RGB'?'linear-gradient(90deg,#FF5E7E,#7C6CFF,#3DD6B0)':glowOf(t);
const ytId=u=>{const m=String(u||'').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:null;};
function matches(p,q){
  const hay=norm([p.name,catName(p.cat),p.desc,p.temp,TEMPS[p.temp]||'',p.uso,p.ip,p.w?p.w+'w':''].join(' '));
  return norm(q).split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200);}

function card(p){
  const off=p.old?Math.round((1-p.price/p.old)*100):0;
  const meta=[p.temp!=='—'?`<span class="kdot" style="--kc:${kc(p.temp)}">${p.temp}</span>`:'',p.w?`<span>${p.w} W</span>`:'',p.lm?`<span>${p.lm.toLocaleString('es-AR')} lm</span>`:'',p.ip!=='IP20'?`<span>${p.ip}</span>`:''].join('');
  return `<a class="card" href="#p-${p.id}">
    <div class="im">${thumb(p)}${off?`<span class="badge off">-${off}%</span>`:''}${(p.video||p.demoVideo)?`<span class="badge vid"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>Video</span>`:''}</div>
    <div class="bd"><span class="nm">${esc(p.name)}</span><div class="meta">${meta}</div>
    <div class="price"><b>${money(p.price)}</b>${p.old?`<s>${money(p.old)}</s>`:''}</div>${p.stock?'':'<span class="nostock">Sin stock por ahora</span>'}</div></a>`;
}

/* ---------- state + routing ---------- */
const F={cat:null,q:'',uso:null,temp:null,sort:'rel'};
let editing=null, adminFilter='';

function renderRail(active){
  $('#rail').innerHTML=CATS.map(c=>`<a href="#cat-${c.id}" class="${active===c.id?'on':''}">${c.name}</a>`).join('');
}
function route(){
  const h=location.hash.slice(1)||'inicio';
  const isAdmin=h==='admin';
  $('#segShop').setAttribute('aria-current',String(!isAdmin));
  $('#segAdmin').setAttribute('aria-current',String(isAdmin));
  $('#sugg').hidden=true;
  if(h.startsWith('p-')){ const p=products.find(x=>x.id===+h.slice(2)); p?viewProduct(p):viewHome(); renderRail(p&&p.cat); }
  else if(h.startsWith('cat-')){ F.cat=h.slice(4); F.q=''; $('#q').value=''; viewCatalog(); renderRail(F.cat); }
  else if(h==='catalogo'){ viewCatalog(); renderRail(F.cat); }
  else if(isAdmin){ viewAdmin(); renderRail(null); }
  else { viewHome(); renderRail(null); }
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);

/* ---------- views ---------- */
function viewHome(){
  const feat=products.filter(p=>p.featured).slice(0,8);
  $('#app').innerHTML=`
  <section class="hero">
    <div>
      <span class="eyebrow">Catálogo 2026 · ${products.length} productos</span>
      <h1 style="margin-top:8px">Luz LED para cada ambiente, de la cocina al patio.</h1>

      <div class="kelvin" aria-label="Guía de temperatura de color">

        <div class="kbar"></div>
        <div class="kticks"><span>2700K<i>Cálida · living</i></span><span style="text-align:center">4000K<i>Neutra · cocina</i></span><span style="text-align:right">6500K<i>Fría · taller</i></span></div>

    </div>
    <div class="hero-art"><img src="radian-logo.svg" alt="Logo de Radián" width="600" height="600"></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Categorías</h2><a href="#catalogo">Ver todo</a></div>
    <div class="cats">${CATS.map(c=>{const ex=products.find(p=>p.cat===c.id)||{...products[0],cat:c.id};const n=products.filter(p=>p.cat===c.id).length;return `<a class="cat" href="#cat-${c.id}"><div class="im">${art(ex,1)}</div><div><b>${c.name}</b><br><small>${n} producto${n===1?'':'s'}</small></div></a>`}).join('')}</div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Destacados</h2><a href="#catalogo">Ver catálogo</a></div>
    <div class="grid">${feat.map(card).join('')}</div>
  </section>`;
}

function filtered(){
  let r=products.filter(p=>(!F.cat||p.cat===F.cat)&&(!F.uso||p.uso===F.uso)&&(!F.temp||TEMP_GROUP[F.temp].includes(p.temp))&&(!F.q||matches(p,F.q)));
  if(F.sort==='asc') r=[...r].sort((a,b)=>a.price-b.price);
  if(F.sort==='desc') r=[...r].sort((a,b)=>b.price-a.price);
  if(F.sort==='az') r=[...r].sort((a,b)=>a.name.localeCompare(b.name,'es'));
  return r;
}
function viewCatalog(){
  const list=filtered();
  const base=products.filter(p=>(!F.q||matches(p,F.q)));
  const title=F.q?`Resultados para “${esc(F.q)}”`:(F.cat?catName(F.cat):'Todo el catálogo');
  const chips=[F.q&&['q',`Búsqueda: ${F.q}`],F.cat&&['cat',catName(F.cat)],F.uso&&['uso',F.uso],F.temp&&['temp',`Luz ${F.temp.toLowerCase()}`]].filter(Boolean);
  $('#app').innerHTML=`
  <div class="crumbs"><a href="#inicio">Inicio</a><span>/</span><span>${F.cat?catName(F.cat):'Catálogo'}</span></div>
  <div class="cat-layout">
    <aside class="side" id="side">
      <div class="fgroup"><h3>Categoría</h3><div class="flist">
        <button data-f="cat" data-v="" class="${!F.cat?'on':''}"><span>Todas</span><small>${base.length}</small></button>
        ${CATS.map(c=>`<button data-f="cat" data-v="${c.id}" class="${F.cat===c.id?'on':''}"><span>${c.name}</span><small>${base.filter(p=>p.cat===c.id).length}</small></button>`).join('')}
      </div></div>
      <div class="fgroup"><h3>Uso</h3><div class="chips">${['Interior','Exterior'].map(u=>`<button class="chip ${F.uso===u?'on':''}" data-f="uso" data-v="${u}">${u}</button>`).join('')}</div></div>
      <div class="fgroup"><h3>Tono de luz</h3><div class="chips">${Object.keys(TEMP_GROUP).map(t=>`<button class="chip ${F.temp===t?'on':''}" data-f="temp" data-v="${t}"><span class="kdot" style="--kc:${kc(TEMP_GROUP[t][TEMP_GROUP[t].length-1])}"></span>${t}</button>`).join('')}</div></div>
    </aside>
    <section style="min-width:0">
      <div class="toolbar">
        <div><h1>${title}</h1><span class="count num">${list.length} producto${list.length===1?'':'s'}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost sm fbtn" id="fbtn">Filtros</button>
          <label class="sr" for="sort" hidden>Ordenar</label>
          <select id="sort" aria-label="Ordenar"><option value="rel">Más relevantes</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option><option value="az">Nombre A–Z</option></select>
        </div>
      </div>
      ${chips.length?`<div class="active">${chips.map(([k,l])=>`<button class="chip on" data-clear="${k}">${esc(l)} ✕</button>`).join('')}<button class="chip" data-clear="all">Limpiar todo</button></div>`:''}
      ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty-state"><b>No encontramos productos con esos filtros</b>Probá con otra palabra, por ejemplo “tira”, “exterior” o “18W”, o quitá algún filtro.</div>`}
    </section>
  </div>`;
  $('#sort').value=F.sort;
  $('#sort').onchange=e=>{F.sort=e.target.value;viewCatalog();};
  $('#fbtn').onclick=()=>$('#side').classList.toggle('open');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f,v=b.dataset.v||null;
    F[f]=(F[f]===v&&f!=='cat')?null:v;
    if(f==='cat'){ history.replaceState(null,'',v?'#cat-'+v:'#catalogo'); renderRail(F.cat); }
    viewCatalog(); if(innerWidth<=820) $('#side').classList.add('open');
  });
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.clear;
    if(k==='all'){F.cat=F.uso=F.temp=null;F.q='';} else F[k]=k==='q'?'':null;
    if(k==='q'||k==='all') $('#q').value='';
    if(k==='cat'||k==='all'){history.replaceState(null,'','#catalogo');renderRail(null);}
    viewCatalog();
  });
}

function viewProduct(p){
  const n=Math.max(p.images.length,3);
  const imgs=Array.from({length:n},(_,i)=>i);
  const rel=products.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
  const vid=ytId(p.video);
  const specs=[['Categoría',catName(p.cat)],p.w&&['Potencia',p.w+' W'],p.lm&&['Flujo luminoso',p.lm.toLocaleString('es-AR')+' lm'],p.temp!=='—'&&['Tono de luz',p.temp+(TEMPS[p.temp]?' · '+TEMPS[p.temp]:'')],['Protección',p.ip+(p.ip==='IP20'?' · solo interior':' · resiste agua y polvo')],['Uso',p.uso],['Código','RAD-'+String(p.id).padStart(4,'0')]].filter(Boolean);
  $('#app').innerHTML=`
  <div class="crumbs"><a href="#inicio">Inicio</a><span>/</span><a href="#cat-${p.cat}">${catName(p.cat)}</a><span>/</span><span>${esc(p.name)}</span></div>
  <div class="pd">
    <div><div class="gal-main" id="gmain">${thumb(p,0)}</div>
      <div class="thumbs">${imgs.map(i=>`<button data-i="${i}" class="${i===0?'on':''}" aria-label="Imagen ${i+1}">${thumb(p,i)}</button>`).join('')}</div></div>
    <div class="pinfo">
      <span class="eyebrow">${catName(p.cat)}</span>
      <h1>${esc(p.name)}</h1>
      <div class="meta">${p.temp!=='—'?`<span class="kdot" style="--kc:${kc(p.temp)}">${p.temp}</span>`:''}${p.w?`<span>${p.w} W</span>`:''}<span>${p.ip}</span></div>
      <div class="pprice"><b>${money(p.price)}</b>${p.old?`<s>${money(p.old)}</s>`:''}</div>
      <div class="pnote">${p.stock?'Disponible · IVA incluido · Precio por unidad':'<span class="nostock">Sin stock por ahora</span> · consultá reposición'}</div>
      <dl class="specs">${specs.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <div class="cta"><button class="btn wa" id="wa"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>Consultar por WhatsApp</button><a class="btn ghost" href="#cat-${p.cat}">Ver similares</a></div>
    </div>
  </div>
  <div class="desc">
    <div><h2>Descripción</h2><p>${esc(p.desc).replace(/\n/g,'<br>')}</p></div>
    <div>${(vid||p.demoVideo)?`<h2>Video del producto</h2>
      <div class="player"><div class="glow"></div><div class="play"><svg width="22" height="22" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="#fff"/></svg></div>
      <div class="cap"><span>${esc(p.name)}</span>${vid?`<a href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">Abrir en YouTube ↗</a>`:'<span>Video de ejemplo</span>'}</div></div>
      <p class="vnote">${vid?'En tu página publicada, el video se reproduce acá mismo, dentro de la ficha del producto. En este prototipo se abre en una pestaña nueva.':'Este es un video de ejemplo. Pegá el link de uno de tus videos de YouTube desde tu panel para ver cómo queda.'}</p>`:`<h2>Video del producto</h2><p class="vnote">Este producto todavía no tiene video. Podés agregarlo pegando el link de YouTube desde tu panel.</p>`}</div>
  </div>
  ${rel.length?`<section class="sec"><div class="sec-h"><h2>También te puede interesar</h2></div><div class="grid">${rel.map(card).join('')}</div></section>`:''}`;
  document.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.thumbs button').forEach(x=>x.classList.toggle('on',x===b));
    $('#gmain').innerHTML=thumb(p,+b.dataset.i);
  });
  $('#wa').onclick=()=>toast(`En tu página real, este botón abre tu WhatsApp con el mensaje: “Hola, quiero consultar por ${p.name}”.`);
}

/* ---------- CMS demo ---------- */
function viewAdmin(){
  $('#app').innerHTML=`
  <div class="cms-intro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
  <p><b>Este es tu panel de administración.</b> Desde acá cargás y editás tus productos: elegí uno de la lista o creá uno nuevo, completá los datos y tocá “Publicar”. En este prototipo el cambio aparece al instante en tu tienda; en tu página real se publica en 1–2 minutos. Los cambios que hagas en esta prueba se borran al recargar la página.</p></div>
  <div class="cms">
    <div class="panel">
      <div class="panel-h"><h2>Productos <span class="count num" style="font-weight:500;color:var(--muted);font-size:14px">(${products.length})</span></h2>
        <input id="af" type="search" placeholder="Filtrar…" value="${esc(adminFilter)}" aria-label="Filtrar productos">
        <button class="btn sm" id="newP">+ Nuevo producto</button></div>
      <div class="tbl"><table><thead><tr><th></th><th>Producto</th><th>Categoría</th><th style="text-align:right">Precio</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    </div>
    <div class="panel" id="formPanel"></div>
  </div>`;
  renderRows(); renderForm();
  $('#af').oninput=e=>{adminFilter=e.target.value;renderRows();};
  $('#newP').onclick=()=>{editing={id:null,cat:'lamparas',name:'',price:'',old:'',w:'',lm:'',temp:'3000K',ip:'IP20',uso:'Interior',desc:'',images:[],video:'',featured:false,stock:true};renderRows();renderForm();$('#f-name').focus();};
}
function renderRows(){
  const list=products.filter(p=>!adminFilter||matches(p,adminFilter));
  $('#rows').innerHTML=list.map(p=>`<tr class="${editing&&editing.id===p.id?'sel':''}"><td><div class="t">${thumb(p)}</div></td><td>${esc(p.name)}${p.stock?'':' <span class="nostock">· sin stock</span>'}</td><td style="color:var(--muted);white-space:nowrap">${catName(p.cat)}</td><td class="num" style="text-align:right;white-space:nowrap">${money(p.price)}</td><td><button class="rowbtn" data-e="${p.id}">Editar</button></td></tr>`).join('')||`<tr><td colspan="5" style="color:var(--muted);padding:20px">Sin coincidencias.</td></tr>`;
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===+b.dataset.e);editing=JSON.parse(JSON.stringify(p));renderRows();renderForm();if(innerWidth<=980)$('#formPanel').scrollIntoView({behavior:'smooth'});});
}
function renderForm(){
  const fp=$('#formPanel');
  if(!editing){fp.innerHTML=`<div class="panel-h"><h2>Editar producto</h2></div><div class="empty-state" style="margin:16px;border-radius:10px"><b>Elegí un producto de la lista</b>o tocá “Nuevo producto” para cargar uno desde cero.</div>`;return;}
  const e=editing;
  fp.innerHTML=`<div class="panel-h"><h2>${e.id?'Editar producto':'Nuevo producto'}</h2>${e.id?`<a class="rowbtn" href="#p-${e.id}">Ver en tu tienda ↗</a>`:''}</div>
  <form class="edit" id="ef" novalidate>
    <div class="field"><label for="f-name">Nombre</label><input id="f-name" required value="${esc(e.name)}" placeholder="Ej: Lámpara LED 9W E27"></div>
    <div class="row2">
      <div class="field"><label for="f-cat">Categoría</label><select id="f-cat">${CATS.map(c=>`<option value="${c.id}" ${c.id===e.cat?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label for="f-uso">Uso</label><select id="f-uso">${['Interior','Exterior'].map(u=>`<option ${u===e.uso?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-price">Precio ($)</label><input id="f-price" inputmode="numeric" value="${e.price}" placeholder="3200"></div>
      <div class="field"><label for="f-old">Precio anterior ($)</label><input id="f-old" inputmode="numeric" value="${e.old||''}" placeholder="Opcional, muestra el descuento"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-w">Potencia (W)</label><input id="f-w" inputmode="numeric" value="${e.w||''}"></div>
      <div class="field"><label for="f-temp">Tono de luz</label><select id="f-temp">${['2700K','3000K','4000K','6500K','RGB','—'].map(t=>`<option ${t===e.temp?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-desc">Descripción</label><textarea id="f-desc" placeholder="Para qué sirve, medidas, qué incluye…">${esc(e.desc)}</textarea></div>
    <div class="field"><label>Fotos</label>
      <label class="drop" id="drop" for="f-img">Arrastrá fotos acá o <u>elegí archivos</u><br><span class="hint">JPG o PNG, hasta 3 MB cada una. La primera es la portada.</span><input id="f-img" type="file" accept="image/*" multiple></label>
      <div class="imgs" id="imgs"></div></div>
    <div class="field"><label for="f-video">Link de YouTube</label><input id="f-video" value="${esc(e.video)}" placeholder="https://youtu.be/…"><span id="ytmsg" class="hint">Subí el video a YouTube (puede ser “No listado”) y pegá el link acá.</span></div>
    <label class="check"><input type="checkbox" id="f-feat" ${e.featured?'checked':''}> Mostrar en “Destacados” de la portada</label>
    <label class="check"><input type="checkbox" id="f-stock" ${e.stock?'checked':''}> Hay stock</label>
    <div class="form-actions">
      <button class="btn" type="submit">Publicar</button>
      ${e.id?`<button class="btn danger sm" type="button" id="del">Eliminar</button>`:`<button class="btn ghost sm" type="button" id="cancel">Cancelar</button>`}
    </div>
  </form>`;
  const showImgs=()=>{ $('#imgs').innerHTML=e.images.map((src,i)=>`<div><img src="${src}" alt="Foto ${i+1}"><button type="button" data-rm="${i}" aria-label="Quitar foto ${i+1}">✕</button></div>`).join('');
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{e.images.splice(+b.dataset.rm,1);showImgs();}); };
  showImgs();
  const addFiles=files=>[...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
    if(f.size>3*1024*1024){toast(`“${f.name}” pesa más de 3 MB. Achicala y probá de nuevo.`);return;}
    const r=new FileReader(); r.onload=()=>{e.images.push(r.result);showImgs();}; r.readAsDataURL(f);
  });
  $('#f-img').onchange=ev=>addFiles(ev.target.files);
  const d=$('#drop');
  d.ondragover=ev=>{ev.preventDefault();d.classList.add('over');};
  d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=ev=>{ev.preventDefault();d.classList.remove('over');addFiles(ev.dataTransfer.files);};
  const yt=()=>{const v=$('#f-video').value.trim(),m=$('#ytmsg');
    if(!v){m.className='hint';m.textContent='Subí el video a YouTube (puede ser “No listado”) y pegá el link acá.';}
    else if(ytId(v)){m.className='yt-ok';m.textContent='Link válido. El video se va a mostrar en la ficha del producto.';}
    else{m.className='yt-bad';m.textContent='Ese link no parece de un video de YouTube. Copialo desde “Compartir” en YouTube.';}};
  $('#f-video').oninput=yt; yt();
  if($('#cancel')) $('#cancel').onclick=()=>{editing=null;renderRows();renderForm();};
  if($('#del')){ const b=$('#del'); b.onclick=()=>{
    if(b.dataset.arm){ products=products.filter(x=>x.id!==e.id); editing=null; toast('Producto eliminado.'); viewAdmin(); return; }
    b.dataset.arm='1'; b.textContent='¿Seguro? Tocá de nuevo'; setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='Eliminar';}},3500);
  };}
  $('#ef').onsubmit=ev=>{
    ev.preventDefault();
    const num=id=>parseInt(String($(id).value).replace(/\D/g,''),10)||0;
    const name=$('#f-name').value.trim(), price=num('#f-price');
    if(!name){toast('Falta el nombre del producto.');$('#f-name').focus();return;}
    if(!price){toast('Falta el precio. Escribilo solo con números, por ejemplo 3200.');$('#f-price').focus();return;}
    const vurl=$('#f-video').value.trim();
    if(vurl&&!ytId(vurl)){toast('Revisá el link de YouTube antes de publicar.');$('#f-video').focus();return;}
    Object.assign(e,{name,price,old:num('#f-old')||null,cat:$('#f-cat').value,uso:$('#f-uso').value,w:num('#f-w'),temp:$('#f-temp').value,desc:$('#f-desc').value.trim(),video:vurl,featured:$('#f-feat').checked,stock:$('#f-stock').checked});
    if(e.uso==='Exterior'&&e.ip==='IP20') e.ip='IP65';
    if(e.old&&e.old<=e.price) e.old=null;
    if(e.id){ const i=products.findIndex(x=>x.id===e.id); products[i]={...products[i],...e}; }
    else { e.id=nextId++; e.lm=e.lm||0; e.demoVideo=false; products.unshift({...e}); }
    editing=JSON.parse(JSON.stringify(products.find(x=>x.id===e.id)));
    toast('Publicado. Ya se ve en tu tienda.');
    viewAdmin();
  };
}

/* ---------- global search ---------- */
(function(){
  const q=$('#q'), box=$('#sugg'); let sel=-1;
  const render=()=>{
    const v=q.value.trim(); sel=-1;
    if(!v){box.hidden=true;return;}
    const r=products.filter(p=>matches(p,v));
    box.innerHTML=r.length?r.slice(0,6).map(p=>`<a href="#p-${p.id}"><span class="t">${thumb(p)}</span><span class="n">${esc(p.name)}</span><span class="p num">${money(p.price)}</span></a>`).join('')+`<a class="all" href="#catalogo" data-all>Ver los ${r.length} resultados</a>`
      :`<div class="empty">No hay productos que coincidan con “${esc(v)}”.</div>`;
    box.hidden=false;
    box.querySelectorAll('[data-all]').forEach(a=>a.onclick=ev=>{ev.preventDefault();goAll();});
  };
  const goAll=()=>{F.q=q.value.trim();F.cat=null;box.hidden=true;if(location.hash==='#catalogo'){viewCatalog();renderRail(null);}else location.hash='catalogo';};
  q.addEventListener('input',render);
  q.addEventListener('focus',render);
  q.addEventListener('keydown',ev=>{
    const items=[...box.querySelectorAll('a')];
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ if(!items.length)return; ev.preventDefault(); sel=(sel+(ev.key==='ArrowDown'?1:-1)+items.length)%items.length; items.forEach((a,i)=>a.classList.toggle('on',i===sel)); }
    else if(ev.key==='Enter'){ ev.preventDefault(); if(sel>=0&&items[sel]){ items[sel].hasAttribute('data-all')?goAll():(location.hash=items[sel].getAttribute('href')); box.hidden=true; } else if(q.value.trim()) goAll(); }
    else if(ev.key==='Escape'){ box.hidden=true; }
  });
  document.addEventListener('click',ev=>{ if(!$('#searchBox').contains(ev.target)) box.hidden=true; });
})();

route();
</script>
